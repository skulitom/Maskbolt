name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      # The toolchain the release builds use; the minimum (Cargo.toml rust-version) is checked below.
      RUST_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update
          rustc "+$RUST_TOOLCHAIN" -vV
      - name: Cache Cargo downloads and dependency builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # One entry per system, toolchain and lockfile; Maskbolt itself is rebuilt from the checkout every run.
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
      - name: Clippy (all targets, warnings are errors)
        run: cargo "+$RUST_TOOLCHAIN" clippy --locked --all-targets -- -D warnings
      - name: Tests (the model-backed end-to-end tests are ignored; they need the 375 MB weights)
        run: cargo "+$RUST_TOOLCHAIN" test --locked --no-fail-fast

  msrv:
    name: Minimum Rust (Cargo.toml rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check every target with the minimum supported compiler
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | tr -d '\r')
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" check --locked --all-targets

  distribution:
    name: Packaging scripts (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Bundle, archive, notices and registry-entry tests
        run: node --test mcpb/mcpb.test.mjs

  docker:
    name: Docker image (for MCP catalogs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the image from the Dockerfile
        run: docker build --tag maskbolt:ci .
      - name: The CLI runs, and the MCP server starts as a non-root user and lists its eight tools
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          test "$(docker run --rm maskbolt:ci version)" = "maskbolt $version"
          test "$(docker run --rm --entrypoint id maskbolt:ci -u)" = "10001"
          # The dependency licence texts ship in the image, as in the release archives.
          docker run --rm --entrypoint cat maskbolt:ci /usr/share/doc/maskbolt/THIRD_PARTY_NOTICES.md > notices.md
          grep -q '^# Third-party license notices' notices.md
          grep -q '| webpki-roots |' notices.md
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            sleep 2
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5
          } | timeout 120 docker run -i --rm maskbolt:ci > replies.jsonl
          python3 - "$version" <<'EOF'
          import json, sys
          replies = {r.get("id"): r for r in map(json.loads, open("replies.jsonl")) if "id" in r}
          info = replies[1]["result"]["serverInfo"]
          tools = sorted(t["name"] for t in replies[2]["result"]["tools"])
          print(info["name"], info["version"], len(tools), "tools:", " ".join(tools))
          assert info["name"] == "maskbolt" and info["version"] == sys.argv[1], info
          assert len(tools) == 8 and all(t.startswith("maskbolt_") for t in tools), tools
          EOF
